AllCops:
  # Matches the installed toolchain (2.7.4). rubocop >= 1.13 dropped 2.4-target
  # analysis, so the previous value made rubocop unrunnable.
  TargetRubyVersion: 2.7
  NewCops: disable

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Comments intentionally use en/em dashes, matching the spec and contract docs.
Style/AsciiComments:
  Enabled: false

# Pragmatic limits for a small API-client resource: five CRUD methods plus
# their validation helpers legitimately run a little longer than the defaults.
Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  Max: 200
  # The webhook handler is one cohesive job — parse, gate, verify, re-check,
  # advise, audit — expressed as many small private steps. Splitting it to satisfy
  # a line count would add indirection with no reader benefit (Constitution V).
  Exclude:
    - "lib/bml_connect/webhooks.rb"

# Keyword arguments do not have the positional-confusion problem this cop exists
# to catch: `reject!(error, 422, reason: ..., actor: ...)` is self-documenting at
# every call site. Positional lists are still bounded.
Metrics/ParameterLists:
  CountKeywordArgs: false

# RSpec describe/context blocks are legitimately long; block-length limits are
# meant for production methods, not example groups.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
